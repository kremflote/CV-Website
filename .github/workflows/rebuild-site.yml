# Rebuilds the site on Cloudflare Pages once a day, so projects tagged or
# untagged with the GitHub topic "portfolio" show up without a new commit.
# Run it by hand from the Actions tab ("Daily site rebuild" > Run workflow)
# right after tagging a repository.
#
# Needs the repository secret CLOUDFLARE_DEPLOY_HOOK_URL (the deploy hook URL
# from Cloudflare Pages > Settings > Builds > Deploy hooks).
#
# GitHub only runs scheduled workflows from the default branch, and in a public
# repository it switches them off after 60 days without repository activity.
# Re-enable it from the Actions tab if that happens.
name: Daily site rebuild

on:
  schedule:
    # 04:17 UTC. Avoids the start of the hour, when GitHub delays or drops scheduled runs.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: rebuild-site
  cancel-in-progress: true

jobs:
  trigger-deploy-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::The repository secret CLOUDFLARE_DEPLOY_HOOK_URL is not set."
            exit 1
          fi
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --request POST --max-time 30 --retry 3 --retry-all-errors "$DEPLOY_HOOK_URL")
          echo "Cloudflare answered HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::The deploy hook request failed (HTTP $status)."
            exit 1
          fi
