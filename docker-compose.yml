services:
  cv-webpage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-webpage
    ports:
      - "5110:5110"
    volumes:
      - ./cv-backend/Databases:/app/Databases
      - ./cv-backend/wwwroot/images:/app/wwwroot/images
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5110
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cv-cloudflared
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - C:/Users/flyin/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - cv-webpage
    restart: unless-stopped